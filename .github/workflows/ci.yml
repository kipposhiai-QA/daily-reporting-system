name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      # postinstall (`prisma generate`) requires DATABASE_URL to resolve prisma.config.ts,
      # but generate only reads the schema and never connects to the DB, so a dummy value is fine.
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      # API結合テスト（app/api/**/*.integration.test.ts）専用のテストDB。本番相当のDBを
      # 誤ってTRUNCATEしないよう、deployジョブが使うDATABASE_URL/DIRECT_URLとは別の
      # Secretsを使う。未設定の場合は以下のステップ・結合テストともにスキップされる
      # （セットアップ手順は docs/test-specification.md 2.1 参照）。
      # `if:` 条件式は secrets コンテキストを直接参照できないため、一度 env を経由する。
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - name: Apply migrations to the test database
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DIRECT_URL }}

      - run: npm run test

      - run: npm run build

  deploy:
    needs: lint-test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: make release
        env:
          # Cloud Runの環境変数として渡すSupabase接続情報。Makefileにはハードコードせず、
          # GitHub Secretsから読み込む（docs/deployment.md参照）。
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
